name: Build GOLD VPN APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar APK Android - GOLD
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Tornar Gradle Executável
        run: chmod +x ./gradlew || true

      - name: Compilar APK Debug (GOLD.apk)
        run: ./gradlew assembleDebug --stacktrace

      - name: Renomear APK para GOLD.apk
        run: |
          mkdir -p output_apk
          cp app/build/outputs/apk/debug/app-debug.apk output_apk/GOLD.apk

      - name: Upload Artifact do APK (GOLD.apk)
        uses: actions/upload-artifact@v4
        with:
          name: GOLD-VPN-APK
          path: output_apk/GOLD.apk
          retention-days: 30